services:
  postgres:
    image: postgres:16-alpine
    container_name: edunet-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-edunet}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-edunet_dev}
      POSTGRES_DB: ${POSTGRES_DB:-edunet}
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-edunet} -d ${POSTGRES_DB:-edunet}"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  pgdata:
