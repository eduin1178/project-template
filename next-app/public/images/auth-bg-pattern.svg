<svg xmlns="http://www.w3.org/2000/svg" width="320" height="320" viewBox="0 0 320 320">
  <defs>
    <pattern id="dotgrid" x="0" y="0" width="40" height="40" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1" fill="#94a3b8" opacity="0.18"/>
    </pattern>
  </defs>
  <rect width="320" height="320" fill="url(#dotgrid)"/>

  <!-- Libro abierto -->
  <g transform="translate(40 60)" opacity="0.22">
    <path d="M0 8 Q18 0 36 8 L36 40 Q18 32 0 40 Z" fill="#60a5fa"/>
    <path d="M36 8 Q54 0 72 8 L72 40 Q54 32 36 40 Z" fill="#3b82f6"/>
    <line x1="8" y1="16" x2="28" y2="14" stroke="#1e3a8a" stroke-width="1" opacity="0.5"/>
    <line x1="8" y1="22" x2="28" y2="20" stroke="#1e3a8a" stroke-width="1" opacity="0.5"/>
    <line x1="8" y1="28" x2="28" y2="26" stroke="#1e3a8a" stroke-width="1" opacity="0.5"/>
    <line x1="44" y1="14" x2="64" y2="16" stroke="#1e3a8a" stroke-width="1" opacity="0.5"/>
    <line x1="44" y1="20" x2="64" y2="22" stroke="#1e3a8a" stroke-width="1" opacity="0.5"/>
    <line x1="44" y1="26" x2="64" y2="28" stroke="#1e3a8a" stroke-width="1" opacity="0.5"/>
  </g>

  <!-- Checklist -->
  <g transform="translate(220 40)" opacity="0.22">
    <rect x="0" y="0" width="56" height="68" rx="4" fill="#fef3c7" stroke="#f59e0b" stroke-width="1.5"/>
    <rect x="6" y="8" width="8" height="8" rx="1.5" fill="none" stroke="#f59e0b" stroke-width="1.5"/>
    <path d="M7 12 L9 14 L13 9" stroke="#10b981" stroke-width="1.8" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
    <line x1="20" y1="12" x2="48" y2="12" stroke="#f59e0b" stroke-width="1.2"/>
    <rect x="6" y="22" width="8" height="8" rx="1.5" fill="none" stroke="#f59e0b" stroke-width="1.5"/>
    <path d="M7 26 L9 28 L13 23" stroke="#10b981" stroke-width="1.8" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
    <line x1="20" y1="26" x2="48" y2="26" stroke="#f59e0b" stroke-width="1.2"/>
    <rect x="6" y="36" width="8" height="8" rx="1.5" fill="none" stroke="#f59e0b" stroke-width="1.5"/>
    <line x1="20" y1="40" x2="48" y2="40" stroke="#f59e0b" stroke-width="1.2"/>
    <rect x="6" y="50" width="8" height="8" rx="1.5" fill="none" stroke="#f59e0b" stroke-width="1.5"/>
    <line x1="20" y1="54" x2="40" y2="54" stroke="#f59e0b" stroke-width="1.2"/>
  </g>

  <!-- Lápiz -->
  <g transform="translate(60 220) rotate(-25)" opacity="0.22">
    <rect x="0" y="0" width="64" height="10" fill="#fbbf24"/>
    <rect x="0" y="0" width="12" height="10" fill="#f87171"/>
    <polygon points="64,0 76,5 64,10" fill="#1f2937"/>
    <polygon points="64,2 70,5 64,8" fill="#fde68a"/>
  </g>

  <!-- Estrella / logro -->
  <g transform="translate(240 220)" opacity="0.22">
    <path d="M20 0 L25 14 L40 14 L28 23 L33 38 L20 29 L7 38 L12 23 L0 14 L15 14 Z" fill="#a78bfa"/>
  </g>

  <!-- Sombreado sutil libro2 (esquina inferior izq) -->
  <g transform="translate(20 280)" opacity="0.18">
    <rect x="0" y="0" width="40" height="6" rx="1" fill="#34d399"/>
    <rect x="2" y="-6" width="40" height="6" rx="1" fill="#22c55e"/>
    <rect x="4" y="-12" width="40" height="6" rx="1" fill="#16a34a"/>
  </g>

  <!-- Burbuja chat / nota -->
  <g transform="translate(180 250)" opacity="0.20">
    <path d="M0 4 Q0 0 4 0 L36 0 Q40 0 40 4 L40 22 Q40 26 36 26 L14 26 L8 32 L10 26 L4 26 Q0 26 0 22 Z" fill="#67e8f9" stroke="#0891b2" stroke-width="1.2"/>
    <line x1="6" y1="8" x2="32" y2="8" stroke="#0891b2" stroke-width="1" opacity="0.6"/>
    <line x1="6" y1="14" x2="28" y2="14" stroke="#0891b2" stroke-width="1" opacity="0.6"/>
    <line x1="6" y1="20" x2="20" y2="20" stroke="#0891b2" stroke-width="1" opacity="0.6"/>
